<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark light">
<title>لوحة التحكم | AMARIX007</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAF9;--card:#fff;--tx:#0f1111;--mu:#565959;--bd:#e5e7eb;--g:#2F442C;--m:#A7E8BD;--ac:#52B788;--lk:#2D6A4F;--er:#ef4444}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1A1A1A;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2a2a2a;--lk:#A7E8BD}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.6 Alexandria,system-ui,sans-serif;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.w{max-width:1150px;margin:auto;padding:0 14px}
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);padding:10px 0}
.tr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ttl{font-size:16px}.ttl small{color:var(--mu);font-weight:400;margin-inline-start:6px}
.sp{flex:1}
.bdg{font-size:11px;padding:2px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.bdg.d{border-color:#FBBF24;color:#FBBF24}.bdg.k{border-color:var(--ac);color:var(--lk)}
.lay{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:14px;align-items:start}
.sd{display:flex;flex-direction:column;gap:4px;position:sticky;top:70px}
.sd button{text-align:start;border:1px solid transparent;background:none;padding:9px 12px;border-radius:12px;cursor:pointer;color:var(--mu);font-weight:600}
.sd button:hover{background:var(--card)}
.sd button.on{background:var(--g);color:var(--m);border-color:var(--ac)}
@media(max-width:800px){.lay{grid-template-columns:1fr}.sd{flex-direction:row;overflow-x:auto;position:static;padding-bottom:4px;scrollbar-width:none}.sd button{white-space:nowrap}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{font-size:17px;margin-bottom:4px}h3{font-size:14px;margin-bottom:8px}
.hint{color:var(--mu);font-size:12px;margin-bottom:10px;line-height:1.7}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.g2,.g3{grid-template-columns:1fr}}
.fld{display:block;margin-bottom:10px;min-width:0}.fld>span{display:block;font-size:12px;color:var(--mu);margin-bottom:4px}
.w2{grid-column:1/-1}
.inp{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;min-height:40px}
.inp:focus{outline:2px solid var(--ac)}
textarea.inp{resize:vertical}
.col{padding:2px;height:40px;cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:10px;cursor:pointer}
.b{background:var(--g);color:var(--m);border:1px solid var(--ac);border-radius:12px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.b:hover{filter:brightness(1.15)}.b:active{transform:scale(.97)}
.b2{background:transparent;color:var(--lk)}
.bd2{background:transparent;color:var(--er);border-color:var(--er)}
.sm{padding:5px 10px;font-size:12px;white-space:nowrap}
.it{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.it:first-of-type{border-top:0}
.im{flex:1;min-width:0}.im b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.im small{color:var(--mu)}
.thm{width:48px;height:48px;border-radius:12px;background:var(--g);color:var(--m);border:1px solid var(--ac);display:inline-flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thm img{width:100%;height:100%;object-fit:cover}
.imgf{display:flex;gap:8px;align-items:center}
.row3{display:grid;grid-template-columns:1.2fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.rowc{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;margin-bottom:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--lk)}.stat span{color:var(--mu);font-size:12px}
ol{padding-inline-start:20px}ol li{margin-bottom:6px}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
#ts{position:fixed;bottom:20px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--g);color:var(--m);padding:8px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#ts.s{opacity:1}#ts.e{background:var(--er);color:#fff}
.oh{border-top:1px solid var(--bd);padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="ts"></div>
<script src="store-data.js"></script>
<script>

const st=(o,p,v)=>{const k=p.split('.'),l=k.pop();k.reduce((a,x)=>a[x]??(a[x]={}),o)[l]=v};
const I={bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',phone:'<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',bot:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M5 12v8h14v-8M7.5 8C5 8 5 4 8 4c2 0 4 4 4 4s2-4 4-4c3 0 3 4.5.5 4"/>',trend:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-5.5 6.5-5.5s6.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.5 0 4.5 1.5 4.5 4"/>',box:'<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',cart:'<path d="M3 4h2l2.4 11h10.2l2-8H6.2"/><circle cx="9" cy="19" r="1.2"/><circle cx="17" cy="19" r="1.2"/>',heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',hs:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>'};

const ic=(n,z=22)=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${I[n]||I.box}</svg>`;
const TYPES=[['shop','متجر عادي (سلة وشراء)'],['boost','خدمات زيادة (يُطلب رابط الحساب)'],['embed','تضمين مواقع (بدون سلة)']];
const SOCK={whatsapp:['wa','واتساب','https://wa.me/9665XXXXXXXX'],telegram:['tg','تيليجرام','https://t.me/username'],instagram:['ig','إنستغرام','https://instagram.com/username'],x:['xx','منصة X','https://x.com/username'],youtube:['yt','يوتيوب','https://youtube.com/@channel'],email:['mail','البريد','mailto:support@example.com']};
const DELIV=[[0,'رابط مستودع / منصة'],[1,'بيانات حساب / اعتماد'],[2,'ملف تنفيذي / سورس كود'],[3,'تنفيذ على رابط حساب العميل بعد الطلب']];
const TABS=[['home','الرئيسية'],['site','الموقع والهوية'],['partner','الشريك'],['banners','البانرات'],['categories','الأقسام'],['products','المنتجات والخدمات'],['embeds','التضمين (بونصات)'],['coupons','كوبونات وعملات'],['social','قنوات التواصل'],['orders','الطلبات']];
const baseCur=()=>{const e=Object.entries(D.rates).find(([,v])=>+v[0]==1);return e?e[0]:'SAR'};
const catName=id=>(D.categories.find(c=>c.id==id)||{}).ar||'—';

function toast(m,k=''){const e=$('#ts');e.textContent=m;e.className='s '+k;clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
function badge(){const b=$('#bdg');if(!b)return;b.className='bdg '+(dirty?'d':'k');b.textContent=dirty?'تعديلات غير منشورة':'منشور'}
function save(){dirty=true;try{localStorage.setItem('amx_draft',JSON.stringify(D));badge()}catch(e){toast('تعذّر حفظ المسودة المحلية','e')}}
let tm;const later=()=>{clearTimeout(tm);tm=setTimeout(save,300)};

/* ---------- حقول ---------- */
function imgf(p,v){const d=String(v||'').startsWith('data:'),logo=/logo/.test(p);
return `<div class="imgf"><span class="thm">${v?`<img src="${esc(v)}" alt="">`:ic('box',20)}</span><input class="inp" dir="ltr" data-p="${p}" data-re="1" value="${d?'':esc(v)}" placeholder="${d?'صورة مرفوعة ✓ — الصق رابطاً لاستبدالها':'https://… رابط الصورة'}"><label class="b b2 sm">رفع<input type="file" accept="image/*" hidden data-up="${p}" data-mx="${logo?512:900}" data-png="${logo?1:0}"></label>${v?`<button class="b bd2 sm" data-a="clr" data-p="${p}" title="حذف">✕</button>`:''}</div>`}
function F(l,p,o={}){const v=g(D,p),t=o.t||'text',a=`data-p="${p}"${o.n?' data-n="1"':''}${o.re?' data-re="1"':''}`;let h;
if(t=='chk')return `<label class="chk"><input type="checkbox" ${a} ${v!==false&&v?'checked':''}> ${l}</label>`;
if(t=='area')h=`<textarea class="inp" rows="${o.r||3}" ${a}>${esc(v)}</textarea>`;
else if(t=='sel')h=`<select class="inp" ${a}>${o.o.map(([k,n])=>`<option value="${esc(k)}" ${k==v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
else if(t=='img')h=imgf(p,v);
else if(t=='col')h=`<input type="color" class="inp col" value="${esc(v||'#000000')}" ${a}>`;
else h=`<input class="inp" type="${t=='num'?'number':'text'}" ${t=='num'?'step="any"':''} value="${esc(v)}" ${o.d?'dir="ltr"':''} ${o.ph?`placeholder="${esc(o.ph)}"`:''} ${a}>`;
return `<div class="fld ${o.w?'w2':''}"><span>${l}</span>${h}</div>`}

/* ---------- صفحات ---------- */
const VIEW={
home(){const n=D.products.length;return `<div class="stats"><div class="stat"><b>${D.categories.length}</b><span>الأقسام</span></div><div class="stat"><b>${n}</b><span>منتجات وخدمات</span></div><div class="stat"><b>${D.embeds.length}</b><span>عناصر التضمين</span></div><div class="stat"><b>${D.banners.length}</b><span>البانرات</span></div><div class="stat"><b>${Object.keys(D.coupons).length}</b><span>الكوبونات</span></div></div>
<div class="card"><h2>كيف تنشر تعديلاتك؟</h2><p class="hint">عدّل ما تشاء ثم اضغط <b>نشر الآن</b> أعلى الصفحة؛ يظهر التغيير لكل الزوار فوراً (حتى داخل التطبيق) دون رفع أي ملف. المسودة تُحفظ على جهازك إلى أن تنشرها.</p>
<div class="acts"><button class="b" data-a="pub">نشر الآن</button><button class="b b2" data-a="exp">نسخة احتياطية (تنزيل)</button><label class="b b2">استيراد نسخة<input type="file" accept=".js,.json" hidden data-imp="1"></label><button class="b bd2" data-a="reset">تجاهل التعديلات غير المنشورة</button></div></div>
<div class="card"><h2>ملاحظات</h2><p class="hint">• الصور المرفوعة تُضغط وتُخزَّن في Supabase Storage ويُوضع رابطها تلقائياً.<br>• الطلبات الجديدة تصلك في تبويب «الطلبات».<br>• لا تشارك بريد وكلمة مرور اللوحة مع أحد.</p></div>`},
site(){const s='site.';return `<div class="card"><h2>الهوية</h2><div class="g2">${F('الاسم - الجزء الأول',s+'n1',{d:1})}${F('الاسم - الجزء الملوّن',s+'n2',{d:1})}${F('الشعار (PNG/SVG/JPG) ويصبح أيقونة التبويب أيضاً',s+'logo',{t:'img',w:1})}${F('العنوان الفرعي (عربي)',s+'sa')}${F('العنوان الفرعي (إنجليزي)',s+'se',{d:1})}${F('وصف الموقع لمحركات البحث',s+'desc',{t:'area',w:1})}</div></div>
<div class="card"><h2>الألوان</h2><div class="g3">${F('اللون الأساسي',s+'col.g',{t:'col'})}${F('لون التمييز الفاتح',s+'col.m',{t:'col'})}${F('لون الإطارات',s+'col.ac',{t:'col'})}</div></div>
<div class="card"><h2>نصوص الذيل</h2><div class="g2">${F('حقوق النشر (عربي)',s+'rt.ar')}${F('حقوق النشر (إنجليزي)',s+'rt.en',{d:1})}${F('تنبيه المخاطر (عربي)',s+'risk.ar',{t:'area'})}${F('تنبيه المخاطر (إنجليزي)',s+'risk.en',{t:'area',d:1})}</div></div>`},
partner(){const s='partner.';return `<div class="card"><h2>الشريك الرسمي (يظهر أعلى الصفحة الرئيسية)</h2>${F('إظهار البطاقة',s+'on',{t:'chk'})}<div class="g2">${F('اسم الشريك',s+'name',{d:1})}${F('رابط الإحالة',s+'url',{d:1,ph:'https://…'})}${F('شعار الشريك (اختياري)',s+'logo',{t:'img',w:1})}${F('الوصف (عربي)',s+'ar',{t:'area',w:1})}${F('الوصف (إنجليزي)',s+'en',{t:'area',w:1,d:1})}${F('نص الزر (عربي)',s+'ba')}${F('نص الزر (إنجليزي)',s+'be',{d:1})}</div></div>`},
banners(){const hs=[['#/','الرئيسية'],...D.categories.map(c=>['#/c/'+c.id,'قسم: '+c.ar])];

categories(){return `<div class="card"><h2>الأقسام</h2><p class="hint">نوع القسم يحدد سلوكه: «تضمين» يعرض مواقع داخل المتجر بدون سلة، «خدمات زيادة» يطلب رابط حساب العميل.</p><button class="b" data-a="add" data-k="categories">+ قسم جديد</button></div>`+D.categories.map((c,i)=>{const k='categories.'+i+'.';return `<div class="card"><div class="it" style="border:0;padding-top:0"><span class="thm">${c.img?`<img src="${esc(c.img)}" alt="">`:ic(c.i)}</span><div class="im"><b>${esc(c.ar)}</b><small>${esc(c.id)}</small></div></div>
<div class="g2">${F('الاسم (عربي)',k+'ar')}${F('الاسم (إنجليزي)',k+'en',{d:1})}${F('الوصف (عربي)',k+'da')}${F('الوصف (إنجليزي)',k+'de',{d:1})}${F('نوع القسم',k+'ty',{t:'sel',o:TYPES,re:1})}${F('الأيقونة',k+'i',{t:'sel',o:ICONS.map(x=>[x,x]),re:1})}${F('صورة/شعار بدل الأيقونة (اختياري)',k+'img',{t:'img',w:1})}</div>
${c.ty=='embed'?'':`<div class="fld"><span>الفلاتر — سطر لكل فلتر بصيغة: عربي|English|خيار1,خيار2</span><textarea class="inp" rows="3" dir="ltr" data-flt="${i}">${esc((c.f||[]).map(f=>`${f.ar}|${f.en}|${(f.o||[]).join(',')}`).join('\n'))}</textarea></div>`}${mv('categories',i)}</div>`}).join('')},
products(){
if(ed!=null&&D.products[ed]){const k='products.'+ed+'.',p=D.products[ed],c=D.categories.find(x=>x.id==p.c)||{},opts=D.categories.filter(x=>x.ty!='embed').map(x=>[x.id,x.ar]);
const fo=(c.f||[]).map(f=>`${f.ar}: ${(f.o||[]).join('، ')}`).join(' | ');
return `<div class="card"><div class="acts" style="margin:0 0 10px"><button class="b b2" data-a="back">← رجوع للقائمة</button></div><h2>${esc(p.ar)}</h2>
<div class="g2">${F('القسم',k+'c',{t:'sel',o:opts,re:1})}${F('طريقة التسليم',k+'t',{t:'sel',o:DELIV,n:1})}${F('الاسم (عربي)',k+'ar',{w:1})}${F('الاسم (إنجليزي)',k+'en',{w:1,d:1})}</div>
<div class="g3">${F('السعر الأساسي ('+baseCur()+')',k+'p',{t:'num'})}${F('سعر قديم مشطوب (اختياري)',k+'o',{t:'num'})}${F('نسبة الخصم %',k+'d',{t:'num'})}${F('التقييم (0-5)',k+'r',{t:'num'})}${F('عدد التقييمات',k+'n',{t:'num'})}${F('ترتيب الأكثر مبيعاً (0 = بدون)',k+'bs',{t:'num'})}</div>
<div class="g2">${F('وسوم للفلاتر (كلمات الخيارات مفصولة بمسافة)',k+'tg',{w:1,ph:'Instagram متابعين'})}${fo?`<p class="hint w2">خيارات فلاتر هذا القسم: ${esc(fo)}</p>`:''}${F('مواصفات مختصرة',k+'sp',{w:1,d:1})}${F('وصف المنتج (عربي)',k+'ds.ar',{t:'area',w:1,r:4})}${F('وصف المنتج (إنجليزي)',k+'ds.en',{t:'area',w:1,r:4,d:1})}${F('صورة المنتج',k+'img',{t:'img',w:1})}</div></div>`}
const q=pq.trim().toLowerCase(),L=D.products.map((p,i)=>[p,i]).filter(([p])=>(!pcat||p.c==pcat)&&(!q||(p.ar+' '+p.en).toLowerCase().includes(q)));
return `<div class="card"><h2>المنتجات والخدمات (${D.products.length})</h2><div class="sw"><input class="inp" style="flex:1;min-width:140px" id="pq" placeholder="بحث…" value="${esc(pq)}"><select class="inp" style="width:auto" id="pc"><option value="">كل الأقسام</option>${D.categories.filter(c=>c.ty!='embed').map(c=>`<option value="${esc(c.id)}" ${pcat==c.id?'selected':''}>${esc(c.ar)}</option>`).join('')}</select><button class="b" data-a="add" data-k="products">+ منتج جديد</button></div>
${L.length?L.map(([p,i])=>`<div class="it"><span class="thm">${p.img?`<img src="${esc(p.img)}" alt="">`:ic((D.categories.find(c=>c.id==p.c)||{}).i)}</span><div class="im"><b>${esc(p.ar)}</b><small>${esc(catName(p.c))} · ${p.p} ${esc(baseCur())}${p.d?' · خصم '+p.d+'%':''}</small></div><button class="b b2 sm" data-a="edit" data-i="${i}">تعديل</button><button class="b b2 sm" data-a="dup" data-k="products" data-i="${i}">نسخ</button><button class="b bd2 sm" data-a="del" data-k="products" data-i="${i}">حذف</button></div>`).join(''):'<p class="hint">لا توجد نتائج.</p>'}</div>`},
embeds(){
const opts=D.categories.filter(x=>x.ty=='embed').map(x=>[x.id,x.ar]);
if(!opts.length)return `<div class="card"><h2>التضمين</h2><p class="hint">أنشئ أولاً قسماً من نوع «تضمين مواقع» من تبويب الأقسام.</p></div>`;
if(ed!=null&&D.embeds[ed]){const k='embeds.'+ed+'.',e=D.embeds[ed];
return `<div class="card"><div class="acts" style="margin:0 0 10px"><button class="b b2" data-a="back">← رجوع للقائمة</button></div><h2>${esc(e.ar)}</h2><p class="hint">بعض المواقع تمنع عرضها داخل إطار؛ يظهر دائماً زر «فتح» كبديل.</p>
<div class="g2">${F('القسم',k+'c',{t:'sel',o:opts})}${F('ارتفاع الإطار (px)',k+'h',{t:'num'})}${F('العنوان (عربي)',k+'ar')}${F('العنوان (إنجليزي)',k+'en',{d:1})}${F('رابط الموقع (https://…)',k+'u',{w:1,d:1})}${F('وصف (عربي)',k+'da',{t:'area',w:1})}${F('وصف (إنجليزي)',k+'de',{t:'area',w:1,d:1})}</div></div>`}
return `<div class="card"><h2>عناصر التضمين (${D.embeds.length})</h2><p class="hint">تظهر داخل قسم التضمين بدون زر سلة.</p><button class="b" data-a="add" data-k="embeds">+ رابط تضمين جديد</button>
${D.embeds.map((e,i)=>`<div class="it"><div class="im"><b>${esc(e.ar)}</b><small dir="ltr">${esc(e.u)}</small></div><button class="b b2 sm" data-a="edit" data-i="${i}">تعديل</button><button class="b b2 sm" data-a="dup" data-k="embeds" data-i="${i}">نسخ</button><button class="b bd2 sm" data-a="del" data-k="embeds" data-i="${i}">حذف</button></div>`).join('')}</div>`},
coupons(){return `<div class="card"><h2>كوبونات الخصم</h2><p class="hint">الكود | نسبة الخصم % | الحد الأدنى للطلب</p><div id="cps">${Object.entries(D.coupons).map(([c,[p,m]])=>`<div class="row3" data-row="cp"><input class="inp" dir="ltr" value="${esc(c)}" placeholder="CODE"><input class="inp" type="number" value="${esc(p)}"><input class="inp" type="number" value="${esc(m)}"><button class="b bd2 sm" data-a="rowdel">✕</button></div>`).join('')}</div><button class="b b2" data-a="rowadd" data-k="cp">+ كوبون</button></div>
<div class="card"><h2>العملات</h2><p class="hint">رمز العملة | سعر الصرف مقابل العملة الأساسية (الأساسية = 1) | الرمز المعروض</p><div id="rts">${Object.entries(D.rates).map(([c,[r,s]])=>`<div class="rowc" data-row="rt"><input class="inp" dir="ltr" value="${esc(c)}" placeholder="USD"><input class="inp" type="number" step="any" value="${esc(r)}"><input class="inp" value="${esc(s)}" placeholder="$"><button class="b bd2 sm" data-a="rowdel">✕</button></div>`).join('')}</div><button class="b b2" data-a="rowadd" data-k="rt">+ عملة</button></div>`},
social(){return `<div class="card"><h2>قنوات التواصل (نافذة الدعم)</h2><p class="hint">اترك الحقل فارغاً لإخفاء القناة.</p>${Object.entries(SOCK).map(([k,[i,n,ph]])=>`<div class="fld"><span>${n}</span><input class="inp" dir="ltr" data-soc="${k}" value="${esc((D.social[k]||[])[1]||'')}" placeholder="${ph}"></div>`).join('')}</div>`},
orders(){return `<div class="card"><h2>الطلبات</h2><p class="hint">آخر 100 طلب من كل الزوار. غيّر الحالة بعد التنفيذ.</p><div id="ob">جارِ التحميل…</div></div>`}
};
function mv(k,i){return `<div class="acts"><button class="b b2 sm" data-a="mv" data-k="${k}" data-i="${i}" data-d="-1">↑</button><button class="b b2 sm" data-a="mv" data-k="${k}" data-i="${i}" data-d="1">↓</button><button class="b bd2 sm" data-a="del" data-k="${k}" data-i="${i}">حذف</button></div>`}

function render(){
$('#app').innerHTML=`<header class="top"><div class="w tr"><b class="ttl">⚙ لوحة التحكم <small>${esc(D.site.n1+D.site.n2)}</small></b><span class="bdg" id="bdg"></span><span class="sp"></span><a class="b b2 sm" href="index.html" target="_blank" rel="noopener">معاينة المتجر ↗</a><button class="b sm" data-a="pub">نشر الآن</button><button class="b b2 sm" data-a="logout">خروج</button></div></header><div class="w lay"><nav class="sd">${TABS.map(([k,n])=>`<button class="${tab==k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</nav><main>${VIEW[tab]()}</main></div>`;badge();if(tab=='orders')loadOrders()}

/* ---------- أحداث ---------- */
function setv(t){let v=t.type=='checkbox'?t.checked:t.value;if(t.dataset.n||t.type=='number')v=v===''?0:+v;st(D,t.dataset.p,v)}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.p){setv(t);later()}else if(t.id=='pq'){pq=t.value;const p=t.selectionStart;render();const n=$('#pq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(t.id=='pc'){pcat=t.value;return render()}
if(d.up)return upl(t);
if(d.imp)return imp(t);
if(d.ost)return ostat(t);
if(d.p){setv(t);save();if(d.re)render();return}
if(d.flt!=null){D.categories[+d.flt].f=t.value.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const [a,b,o]=l.split('|');return{ar:(a||'').trim(),en:(b||a||'').trim(),o:(o||'').split(',').map(x=>x.trim()).filter(Boolean)}});save();return}
if(d.soc!=null){const v=t.value.trim();if(v)D.social[d.soc]=[SOCK[d.soc][0],v];else delete D.social[d.soc];save();return}
const row=t.closest('[data-row]');if(row)rows(row.dataset.row)});
function rows(kind){const box=kind=='cp'?'#cps':'#rts',o={};document.querySelectorAll(box+' [data-row]').forEach(r=>{const [a,b,c]=r.querySelectorAll('input'),k=a.value.trim().toUpperCase();if(!k)return;o[k]=kind=='cp'?[+b.value||0,+c.value||0]:[+b.value||1,c.value||k]});
if(kind=='rt'&&!Object.keys(o).length)o.SAR=[1,'ر.س'];D[kind=='cp'?'coupons':'rates']=o;save()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-tab]');if(!b)return;const d=b.dataset;
if(d.tab){tab=d.tab;ed=null;render();scrollTo(0,0);return}
const a=d.a;if(!a)return;
if(a=='exp')return exp();
if(a=='pub')return publish();
if(a=='logout'){try{localStorage.removeItem('amx_sb')}catch{}SES=null;return loginView()}
if(a=='reset'){if(confirm('تجاهل التعديلات غير المنشورة والعودة للنسخة المنشورة؟')){try{localStorage.removeItem('amx_draft')}catch{}loadCfg().then(render)}return}
if(a=='clr'){st(D,d.p,'');save();return render()}
if(a=='back'){ed=null;return render()}
if(a=='edit'){ed=+d.i;return render()}
if(a=='rowdel'){const r=b.closest('[data-row]'),kd=r.dataset.row;r.remove();return rows(kd)}
if(a=='rowadd'){const tpl=d.k=='cp'?'<div class="row3" data-row="cp"><input class="inp" dir="ltr" placeholder="CODE"><input class="inp" type="number" value="10"><input class="inp" type="number" value="0"><button class="b bd2 sm" data-a="rowdel">✕</button></div>':'<div class="rowc" data-row="rt"><input class="inp" dir="ltr" placeholder="USD"><input class="inp" type="number" step="any" value="1"><input class="inp" placeholder="$"><button class="b bd2 sm" data-a="rowdel">✕</button></div>';document.querySelector(d.k=='cp'?'#cps':'#rts').insertAdjacentHTML('beforeend',tpl);return}
const k=d.k,i=+d.i;
if(a=='add'){const it=NEW[k]();if(k=='products'||k=='embeds'){D[k].unshift(it);ed=0}else D[k].push(it);save();return render()}
if(a=='dup'){const c=clone(D[k][i]);c.id=(k=='products'?'p':'e')+uid();c.ar+=' (نسخة)';D[k].splice(i+1,0,c);save();ed=i+1;return render()}
if(a=='mv'){const j=i+ +d.d;if(j<0||j>=D[k].length)return;[D[k][i],D[k][j]]=[D[k][j],D[k][i]];save();return render()}
if(a=='del'){
 if(k=='categories'){const id=D.categories[i].id,n=D.products.filter(p=>p.c==id).length+D.embeds.filter(x=>x.c==id).length;if(!confirm(n?`سيُحذف القسم و${n} عنصر بداخله. متابعة؟`:'حذف القسم؟'))return;D.products=D.products.filter(p=>p.c!=id);D.embeds=D.embeds.filter(x=>x.c!=id)}
 else if(!confirm('تأكيد الحذف؟'))return;
 D[k].splice(i,1);save();render()}});
const NEW={
categories:()=>({id:'c'+uid(),ty:'shop',i:'box',ar:'قسم جديد',en:'New category',da:'',de:'',img:'',f:[]}),
products:()=>({id:'p'+uid(),c:(D.categories.find(c=>c.ty!='embed')||{}).id||'',ar:'منتج جديد',en:'New product',p:100,o:0,d:0,r:5,n:0,bs:0,t:0,tg:'',sp:'',ds:{ar:'',en:''},img:''}),
embeds:()=>({id:'e'+uid(),c:(D.categories.find(c=>c.ty=='embed')||{}).id||'',ar:'عنوان جديد',en:'New item',da:'',de:'',u:'https://',h:480}),
banners:()=>({ar:'عنوان البانر',en:'Banner title',sa:'',se:'',h:'#/',img:''})};

/* ---------- صور ---------- */
const rd=(f,cb)=>{const r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(f)};
function setimg(p,u){st(D,p,u);save();render()}
async function up(blob,ext,type){const name='img/'+uid()+'.'+ext,r=await api('/storage/v1/object/store-images/'+name,{method:'POST',headers:{'Content-Type':type,'x-upsert':'true'},body:blob});if(!r.ok)throw new Error((await r.text()).slice(0,150));return SB_URL+'/storage/v1/object/public/store-images/'+name}
function upl(t){const f=t.files[0];if(!f)return;const p=t.dataset.up,mx=+t.dataset.mx||900,png=t.dataset.png=='1'||f.type=='image/png'&&f.size<150000,fail=e=>toast('فشل رفع الصورة: '+e.message,'e');
if(f.type=='image/svg+xml'){if(f.size>3e5)return toast('ملف SVG كبير جداً','e');return up(f,'svg','image/svg+xml').then(u=>setimg(p,u)).catch(fail)}
rd(f,u=>{const im=new Image();im.onload=()=>{const r=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*r));c.height=Math.max(1,Math.round(im.height*r));c.getContext('2d').drawImage(im,0,0,c.width,c.height);const ty=png?'image/png':'image/jpeg';c.toBlob(b=>up(b,png?'png':'jpg',ty).then(u=>setimg(p,u)).catch(fail),ty,.82)};im.onerror=()=>toast('ملف صورة غير صالح','e');im.src=u})}

/* ---------- تصدير / استيراد ---------- */
function exp(){const txt='window.AMX='+JSON.stringify(D,null,1)+';\n',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/javascript'}));a.download='store-data.js';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4);toast('تم تنزيل نسخة احتياطية')}
function imp(t){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(String(r.result).replace(/^[\s\S]*?window\.AMX\s*=\s*/,'').replace(/;\s*$/,''));if(!Array.isArray(o.categories)||!Array.isArray(o.products))throw 0;D={...clone(EMPTY),...o};D.site={...EMPTY.site,...D.site};D.partner={...EMPTY.partner,...D.partner};save();render();toast('تم الاستيراد')}catch{toast('ملف غير صالح','e')}};r.readAsText(f)}

/* ---------- Supabase: دخول ونشر وطلبات ---------- */
const sget=()=>{try{return JSON.parse(localStorage.getItem('amx_sb'))}catch{return null}};
async function auth(body,grant){const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'فشل تسجيل الدخول');SES={access_token:j.access_token,refresh_token:j.refresh_token,exp:Math.floor(Date.now()/1e3)+(j.expires_in||3600),email:(j.user||{}).email};try{localStorage.setItem('amx_sb',JSON.stringify(SES))}catch{}return SES}
async function tok(){if(!SES)throw new Error('login');if(SES.exp-60<Date.now()/1e3)await auth({refresh_token:SES.refresh_token},'refresh_token');return SES.access_token}
async function api(path,o={}){const t=await tok();return fetch(SB_URL+path,{...o,headers:{apikey:SB_KEY,Authorization:'Bearer '+t,...(o.headers||{})}})}
function loginView(msg=''){$('#app').innerHTML=`<div class="w" style="max-width:380px;margin-top:12vh"><form class="card" id="lf"><h2 style="text-align:center">⚙ لوحة التحكم</h2><p class="hint" style="text-align:center">سجّل الدخول بحساب المدير</p><div class="fld"><span>البريد الإلكتروني</span><input class="inp" name="e" type="email" dir="ltr" autocomplete="email" required></div><div class="fld"><span>كلمة المرور</span><input class="inp" name="p" type="password" dir="ltr" autocomplete="current-password" required></div><p id="le" style="color:var(--er);font-size:12px;min-height:18px">${esc(msg)}</p><button class="b" style="width:100%">دخول</button></form></div>`}
document.addEventListener('submit',async e=>{if(e.target.id!='lf')return;e.preventDefault();const f=new FormData(e.target),b=e.target.querySelector('.b');b.disabled=true;try{await auth({email:f.get('e').trim(),password:f.get('p')},'password');await boot()}catch(x){b.disabled=false;$('#le').textContent=x.message}});
async function loadCfg(){try{const r=await api('/rest/v1/store_config?id=eq.1&select=data');if(!r.ok)throw new Error(await r.text());const row=(await r.json())[0];D=clone(row&&row.data&&Array.isArray(row.data.products)?row.data:PUB);dirty=!row}catch(e){D=clone(PUB);dirty=true;toast('تعذّر تحميل البيانات المنشورة: '+String(e.message).slice(0,80),'e')}fix();
try{const dr=JSON.parse(localStorage.getItem('amx_draft')||'null');if(dr&&Array.isArray(dr.products)){if(confirm('توجد تعديلات غير منشورة محفوظة على هذا الجهاز. هل تريد استعادتها؟')){D=dr;fix();dirty=true}else localStorage.removeItem('amx_draft')}}catch{}}
async function publish(){if(!confirm('نشر التعديلات لكل الزوار الآن؟'))return;D.ts=Date.now();try{const r=await api('/rest/v1/store_config',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:D,updated_at:new Date().toISOString()})});if(!r.ok)throw new Error((await r.text()).slice(0,200));dirty=false;try{localStorage.removeItem('amx_draft')}catch{}badge();toast('تم النشر — التعديلات ظاهرة للزوار الآن')}catch(e){toast('فشل النشر: '+e.message,'e')}}
async function loadOrders(){const box=$('#ob');try{const r=await api('/rest/v1/orders?select=*&order=created_at.desc&limit=100');if(!r.ok)throw new Error(await r.text());const o=await r.json();if(!box)return;box.innerHTML=o.length?o.map(x=>`<div class="oh"><div class="tr"><b dir="ltr">${esc(x.id)}</b><span class="hint" style="margin:0">${esc(new Date(x.created_at).toLocaleString('ar'))}</span><span class="sp"></span><select class="inp" style="width:auto;min-height:32px" data-ost="${esc(x.id)}">${[['new','جديد'],['processing','قيد التنفيذ'],['done','مكتمل'],['cancelled','ملغي']].map(([k,n])=>`<option value="${k}" ${x.status==k?'selected':''}>${n}</option>`).join('')}</select></div><div class="hint" style="margin:4px 0 0">${esc(x.customer_name||'—')} · <bdi dir="ltr">${esc(x.customer_email||'')}</bdi> · الإجمالي: ${(+x.total).toFixed(2)} ${esc(baseCur())}<br>${(x.items||[]).map(i=>esc(i.name+' ×'+i.q+(i.link?' ← '+i.link:''))).join('<br>')}</div></div>`).join(''):'<p class="hint">لا توجد طلبات بعد.</p>'}catch(e){if($('#ob'))$('#ob').textContent='تعذّر تحميل الطلبات: '+String(e.message).slice(0,120)}}
async function ostat(t){try{const r=await api('/rest/v1/orders?id=eq.'+encodeURIComponent(t.dataset.ost),{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({status:t.value})});if(!r.ok)throw new Error(await r.text());toast('تم تحديث الحالة')}catch(e){toast('فشل التحديث','e')}}
async function boot(){try{localStorage.removeItem('amx_cfg')}catch{}SES=sget();if(SES){try{await tok()}catch{SES=null}}if(!SES)return loginView();await loadCfg();render()}
boot();
</script>
</body>
</html>
